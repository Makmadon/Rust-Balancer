[package]
name = "rust-balancer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Cloud-native Layer 7 HTTP Load Balancer for N upstream services with shared state and active/passive health checks"
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1.9"
http = "1.2"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
pretty_assertions = "1.4"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
future-incompatible = { level = "warn", priority = -1 }
missing_docs = "deny"
nonstandard_style = { level = "deny", priority = -2 }

[lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
clone_on_copy = { level = "deny", priority = 8 }
needless_collect = { level = "deny", priority = 7 }
manual_ok_or = { level = "deny", priority = 6 }
unnecessary_wraps = { level = "deny", priority = 5 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
